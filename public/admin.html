<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - JusticeLine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <i class="fa-solid fa-scale-balanced fa-2x"></i>
            <h1>Admin Control Panel</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Back Home</a></li>
                <li id="logoutBtn" style="display: none;"><a href="#" onclick="adminLogout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="align-items: flex-start; margin-top: 2rem;">
        
        <!-- Admin Login Section -->
        <div id="adminLoginSection" class="glass-card" style="margin: auto; width: 100%; max-width: 400px;">
            <h2>Admin Privileges Required</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Admin Username</label>
                    <input type="text" id="adminId" class="form-control" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPass" class="form-control" required placeholder="••••••••">
                </div>
                <!-- Default admin pass is admin123 -->
                <button type="submit" class="btn mt-3"><i class="fa-solid fa-lock"></i> Secure Login</button>
                <div id="adminLoginMsg" class="mt-3 text-center" style="color: #ffbaba;"></div>
            </form>
        </div>

        <!-- Admin Dashboard Section -->
        <div id="adminDashSection" class="glass-card large" style="display: none; width: 100%; max-width: 1200px;">
            <h2>System Overview & Control Panel</h2>
            <div style="display: flex; gap: 20px; margin-bottom: 2rem; flex-wrap: wrap;">
                <div class="feature-col" style="flex: 1; min-width: 200px;">
                    <i class="fa-solid fa-file-contract"></i>
                    <h3 id="statTotal" style="font-size: 2rem; margin: 10px 0;">0</h3>
                    <p style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Total Complaints</p>
                </div>
                <div class="feature-col" style="flex: 1; min-width: 200px; border-top: 4px solid #dd6b20;">
                    <i class="fa-solid fa-spinner" style="color: #dd6b20;"></i>
                    <h3 id="statPending" style="font-size: 2rem; margin: 10px 0;">0</h3>
                    <p style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Pending Review</p>
                </div>
                <div class="feature-col" style="flex: 1; min-width: 200px; border-top: 4px solid #38a169;">
                    <i class="fa-solid fa-check-double" style="color: #38a169;"></i>
                    <h3 id="statResolved" style="font-size: 2rem; margin: 10px 0;">0</h3>
                    <p style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Resolved Issues</p>
                </div>
            </div>

            <!-- Professional Chart Box -->
            <div style="background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid rgba(255,255,255,0.05); height: 350px;">
                <canvas id="statsChart"></canvas>
            </div>

            <div style="overflow-x: auto;">
                <table style="font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date / Location</th>
                            <th>User info</th>
                            <th>Incident Title & Description</th>
                            <th>Evidence</th>
                            <th>Status Control</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminComplaintsBody">
                        <tr><td colspan="7" class="text-center">Loading systemic records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content" style="max-width: 90vw;">
            <img id="modalImg" src="" style="max-width: 100%; max-height: 70vh; border-radius: 8px;">
            <div class="modal-actions">
                <button class="btn secondary" onclick="document.getElementById('imageModal').style.display='none'">Close Image</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        let statsChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('isAdmin')) {
                showDashboard();
            }
        });

        // Toggle Views
        function showDashboard() {
            document.getElementById('adminLoginSection').style.display = 'none';
            document.getElementById('adminDashSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            fetchAdminStats();
            fetchAdminData();
        }

        // Admin Logout
        function adminLogout() {
            localStorage.removeItem('isAdmin');
            window.location.reload();
        }

        // Fetch Data
        async function fetchAdminData() {
            try {
                const response = await fetch(`/api/admin/complaints`);
                const data = await response.json();
                const tbody = document.getElementById('adminComplaintsBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No complaints filed yet.</td></tr>';
                    return;
                }

                data.forEach(comp => {
                    let badgeClass = 'pending';
                    if (comp.Status === 'In Progress') badgeClass = 'progress';
                    if (comp.Status === 'Resolved') badgeClass = 'resolved';

                    const imgCell = comp.Image 
                        ? `<button class="btn secondary" onclick="viewImage('${comp.Image}')" style="padding: 5px 10px; font-size:0.8rem;"><i class="fa-solid fa-image"></i> View</button>` 
                        : '<em>No Evidence</em>';

                    const row = `
                        <tr>
                            <td>#${String(comp.ComplaintID).padStart(4, '0')}</td>
                            <td>
                                <strong>Date:</strong> ${comp.Date}<br>
                                <strong>GPS:</strong> ${comp.Location || 'Not provided'}
                            </td>
                            <td>
                                <strong>${comp.Name}</strong><br>
                                ${comp.Phone}<br>
                                <small>${comp.Email}</small>
                            </td>
                            <td>
                                <strong>${comp.Title}</strong><br>
                                <small>${comp.Description}</small><br>
                                <span style="color: var(--accent-color);">Pri: ${comp.Priority} / Cat: ${comp.Category}</span>
                            </td>
                            <td>${imgCell}</td>
                            <td>
                                <select class="form-control" style="width: auto; padding: 5px; font-size: 0.8rem;" onchange="updateStatus(${comp.ComplaintID}, this.value)">
                                    <option value="Pending" ${comp.Status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="In Progress" ${comp.Status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="Resolved" ${comp.Status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                    <option value="Rejected" ${comp.Status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                                </select>
                            </td>
                            <td>
                                <button class="btn" style="background: #e53e3e; color: white; padding: 5px 10px; font-size:0.8rem;" onclick="deleteRecord(${comp.ComplaintID})"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
                document.getElementById('adminComplaintsBody').innerHTML = '<tr><td colspan="7" class="text-center">Failed to fetch secured data.</td></tr>';
            }
        }

        async function fetchAdminStats() {
            try {
                const response = await fetch(`/api/admin/stats`);
                const stats = await response.json();
                
                const total = stats.total || 0;
                const pending = stats.pending || 0;
                const resolved = stats.resolved || 0;
                
                document.getElementById('statTotal').innerText = total;
                document.getElementById('statPending').innerText = pending;
                document.getElementById('statResolved').innerText = resolved;
                
                renderChart(total, pending, resolved);
            } catch(e) {}
        }
        
        function renderChart(total, pending, resolved) {
            const ctx = document.getElementById('statsChart').getContext('2d');
            
            if(statsChartInstance) {
                statsChartInstance.destroy();
            }
            
            statsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Total Operations', 'Pending Cases', 'Resolved Cases'],
                    datasets: [{
                        label: 'Complaint Statistics',
                        data: [total, pending, resolved],
                        backgroundColor: [
                            'rgba(214, 158, 46, 0.7)',
                            'rgba(221, 107, 32, 0.7)',
                            'rgba(56, 161, 105, 0.7)'
                        ],
                        borderColor: [
                            'rgba(214, 158, 46, 1)',
                            'rgba(221, 107, 32, 1)',
                            'rgba(56, 161, 105, 1)'
                        ],
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#e2e8f0', stepSize: 1 }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#e2e8f0' }
                        }
                    }
                }
            });
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(`/api/admin/complaints/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                fetchAdminData();
                fetchAdminStats();
            } catch (e) {
                alert('Action blocked.');
            }
        }

        async function deleteRecord(id) {
            if(confirm("Permanently erase record #"+id+"?")) {
                try {
                    await fetch(`/api/admin/complaints/${id}`, {
                        method: 'DELETE'
                    });
                    fetchAdminData();
                    fetchAdminStats();
                } catch (e) {}
            }
        }

        function viewImage(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').style.display = 'flex';
        }
    </script>
</body>
</html>
