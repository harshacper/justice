<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JusticeLine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <i class="fa-solid fa-scale-balanced fa-2x"></i>
            <h1>JusticeLine</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="glass-card">
            <h2>User Secure Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" required placeholder="User Email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn mt-3">Access Account</button>
                <div id="loginMsg" class="mt-3 text-center" style="color: #ffbaba;"></div>
            </form>
            <p class="text-center mt-3" style="font-size: 0.9rem;">New User? <a href="register.html" style="color: var(--accent-color);">Create Account</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
