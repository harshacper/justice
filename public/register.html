<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JusticeLine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <i class="fa-solid fa-scale-balanced fa-2x"></i>
            <h1>JusticeLine</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="glass-card">
            <h2>User Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" class="form-control" required placeholder="123-456-7890">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPass" class="form-control" required placeholder="••••••••" minlength="6">
                </div>
                <div class="form-group">
                    <label>Complete Address</label>
                    <textarea id="regAddress" class="form-control" rows="3" required placeholder="123 Main St..."></textarea>
                </div>
                <button type="submit" class="btn mt-3">Register Account</button>
                <div id="regMsg" class="mt-3 text-center"></div>
            </form>
            <p class="text-center mt-3" style="font-size: 0.9rem;">Already have an account? <a href="login.html" style="color: var(--accent-color);">Login here</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
